<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="48" fill="#0F172A" />
  
  <!-- Ambient Gradient Orbs -->
  <circle cx="90" cy="90" r="140" fill="url(#bgGrad)" opacity="0.4" filter="url(#softGlow)" />
  <circle cx="320" cy="310" r="120" fill="#06B6D4" opacity="0.25" filter="url(#softGlow)" />
  <circle cx="340" cy="80" r="90" fill="#818CF8" opacity="0.25" filter="url(#softGlow)" />

  <!-- Grid mesh overlay lines -->
  <path d="M 0 100 H 400 M 0 200 H 400 M 0 300 H 400" stroke="#334155" stroke-width="1" opacity="0.25" />
  <path d="M 100 0 V 400 M 200 0 V 400 M 300 0 V 400" stroke="#334155" stroke-width="1" opacity="0.25" />

  <!-- Geometric Avatar Silhouette -->
  <g transform="translate(200, 190)">
    <!-- Tech Aura Ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#bgGrad)" stroke-width="3" stroke-dasharray="10 8" opacity="0.8" />
    <circle cx="0" cy="0" r="95" fill="#1E293B" stroke="#475569" stroke-width="2" />
    
    <!-- Stylized Developer Head / Face -->
    <circle cx="0" cy="-25" r="38" fill="url(#avatarGrad)" />
    <!-- Glasses / Modern Developer Visor -->
    <rect x="-30" y="-32" width="60" height="15" rx="6" fill="#0F172A" />
    <rect x="-26" y="-29" width="22" height="9" rx="3" fill="#6366F1" opacity="0.8" />
    <rect x="4" y="-29" width="22" height="9" rx="3" fill="#06B6D4" opacity="0.8" />
    
    <!-- Torso / Shoulders -->
    <path d="M -60 70 C -60 25, 60 25, 60 70 Z" fill="url(#avatarGrad)" />
    <!-- Inner Hoodie V-Neck -->
    <path d="M -22 25 L 0 52 L 22 25 Z" fill="#6366F1" />

    <!-- Code Badges Floating -->
    <g transform="translate(-85, -70)">
      <rect width="44" height="26" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1.5" />
      <text x="22" y="17" fill="#818CF8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
    </g>
    <g transform="translate(48, 40)">
      <rect width="44" height="26" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5" />
      <text x="22" y="17" fill="#22D3EE" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TS</text>
    </g>
  </g>
</svg>
