<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="algoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#algoBg)" />

  <g transform="translate(60, 50)">
    <rect width="680" height="400" rx="16" fill="#090D16" stroke="#334155" stroke-width="1.5" />
    <rect width="680" height="42" rx="16" fill="#1E293B" />
    <circle cx="28" cy="21" r="5" fill="#EF4444" />
    <circle cx="46" cy="21" r="5" fill="#F59E0B" />
    <circle cx="64" cy="21" r="5" fill="#10B981" />
    <text x="340" y="26" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">A* Search & Dijkstra Graph Visualizer</text>

    <!-- Visualizer Canvas & Grid -->
    <g transform="translate(24, 60)">
      <!-- Controls Toolbar -->
      <rect width="632" height="45" rx="8" fill="#1E293B" />
      <rect x="15" y="10" width="80" height="25" rx="5" fill="#10B981" />
      <text x="55" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">▶ Visualize</text>
      <rect x="105" y="10" width="75" height="25" rx="5" fill="#334155" />
      <text x="142" y="27" fill="#E2E8F0" font-family="sans-serif" font-size="11" text-anchor="middle">Clear Board</text>
      <rect x="190" y="10" width="110" height="25" rx="5" fill="#334155" />
      <text x="245" y="27" fill="#E2E8F0" font-family="sans-serif" font-size="11" text-anchor="middle">Generate Maze</text>

      <text x="490" y="27" fill="#38BDF8" font-family="monospace" font-size="12">Nodes Explored: 348</text>
      <text x="615" y="27" fill="#F59E0B" font-family="monospace" font-size="12">Cost: 42</text>

      <!-- Grid Cells Simulation -->
      <g transform="translate(0, 60)">
        <rect width="632" height="250" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
        
        <!-- Maze walls (dark purple/slate blocks) -->
        <rect x="120" y="20" width="30" height="180" rx="4" fill="#334155" />
        <rect x="220" y="80" width="30" height="150" rx="4" fill="#334155" />
        <rect x="340" y="20" width="30" height="160" rx="4" fill="#334155" />
        <rect x="440" y="90" width="30" height="140" rx="4" fill="#334155" />

        <!-- Visited Nodes Cloud (Cyan / Blue) -->
        <rect x="50" y="50" width="60" height="60" rx="8" fill="#0284C7" opacity="0.4" />
        <rect x="160" y="120" width="50" height="70" rx="8" fill="#0284C7" opacity="0.5" />
        <rect x="260" y="40" width="70" height="80" rx="8" fill="#0284C7" opacity="0.4" />
        <rect x="380" y="120" width="50" height="80" rx="8" fill="#0284C7" opacity="0.5" />

        <!-- Shortest Path Wave (Vibrant Gold / Yellow) -->
        <path d="M 40 125 Q 120 220, 180 160 T 300 60 T 400 200 T 540 125" fill="none" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Start Node (Green Flag) -->
        <circle cx="40" cy="125" r="14" fill="#10B981" />
        <polygon points="36,117 48,125 36,133" fill="#FFFFFF" />

        <!-- Target / Finish Node (Red Bullseye) -->
        <circle cx="540" cy="125" r="14" fill="#EF4444" />
        <circle cx="540" cy="125" r="7" fill="#FFFFFF" />
        <circle cx="540" cy="125" r="3" fill="#EF4444" />
      </g>
    </g>
  </g>
</svg>
