<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#aiBg)" />

  <!-- Background decorative sparkles & nodes -->
  <circle cx="200" cy="100" r="120" fill="#8B5CF6" opacity="0.2" filter="blur(35px)" />
  <circle cx="650" cy="350" r="140" fill="#EC4899" opacity="0.15" filter="blur(40px)" />

  <!-- App Window Mockup -->
  <g transform="translate(60, 50)">
    <rect width="680" height="400" rx="16" fill="#0F172A" stroke="#3730A3" stroke-width="1.5" />
    <rect width="680" height="42" rx="16" fill="#1E1B4B" />
    <circle cx="28" cy="21" r="5" fill="#EF4444" />
    <circle cx="46" cy="21" r="5" fill="#F59E0B" />
    <circle cx="64" cy="21" r="5" fill="#10B981" />
    <rect x="250" y="12" width="180" height="18" rx="9" fill="#312E81" />
    <text x="340" y="25" fill="#C7D2FE" font-family="sans-serif" font-size="10" text-anchor="middle">studysync.ai/workspace</text>

    <!-- Split view: Notes & AI Summarizer -->
    <!-- Left Pane: Markdown Notes -->
    <g transform="translate(20, 60)">
      <rect width="310" height="320" rx="10" fill="#18182B" stroke="#312E81" stroke-width="1" />
      <text x="18" y="32" fill="#E0E7FF" font-family="sans-serif" font-size="13" font-weight="bold">CS340: Distributed Systems</text>
      <rect x="18" y="44" width="120" height="4" rx="2" fill="#6366F1" />

      <!-- Paragraph lines -->
      <rect x="18" y="65" width="260" height="8" rx="4" fill="#4B5563" />
      <rect x="18" y="85" width="240" height="8" rx="4" fill="#4B5563" />
      <rect x="18" y="105" width="270" height="8" rx="4" fill="#4B5563" />
      <rect x="18" y="125" width="180" height="8" rx="4" fill="#4B5563" />

      <!-- Code block simulation -->
      <rect x="18" y="150" width="274" height="90" rx="6" fill="#0F172A" />
      <text x="30" y="174" fill="#A5B4FC" font-family="monospace" font-size="11">async function consensus() {</text>
      <text x="45" y="196" fill="#38BDF8" font-family="monospace" font-size="11">  await raft.replicate(log);</text>
      <text x="45" y="218" fill="#34D399" font-family="monospace" font-size="11">  return quorum.accepted;</text>
      <text x="30" y="234" fill="#A5B4FC" font-family="monospace" font-size="11">}</text>

      <rect x="18" y="258" width="220" height="8" rx="4" fill="#4B5563" />
      <rect x="18" y="278" width="200" height="8" rx="4" fill="#4B5563" />
    </g>

    <!-- Right Pane: AI Flashcards & Key Takeaways -->
    <g transform="translate(350, 60)">
      <rect width="310" height="320" rx="10" fill="#18182B" stroke="#312E81" stroke-width="1" />
      
      <!-- AI Header badge -->
      <rect x="16" y="16" width="130" height="26" rx="13" fill="url(#purpleGrad)" />
      <text x="81" y="33" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✨ AI Key Takeaways</text>

      <!-- Flashcard 1 -->
      <rect x="16" y="55" width="278" height="70" rx="8" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1" />
      <text x="28" y="78" fill="#C7D2FE" font-family="sans-serif" font-size="11" font-weight="bold">Raft Consensus Rule</text>
      <text x="28" y="98" fill="#94A3B8" font-family="sans-serif" font-size="10">Leader election requires majority votes (>50%).</text>

      <!-- Flashcard 2 -->
      <rect x="16" y="135" width="278" height="70" rx="8" fill="#1E1B4B" stroke="#6366F1" stroke-width="1" />
      <text x="28" y="158" fill="#C7D2FE" font-family="sans-serif" font-size="11" font-weight="bold">CAP Theorem Balance</text>
      <text x="28" y="178" fill="#94A3B8" font-family="sans-serif" font-size="10">Consistency vs Availability under Partition tolerance.</text>

      <!-- Audio / Timer session bar -->
      <rect x="16" y="225" width="278" height="75" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="28" y="250" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold">Pomodoro Deep Focus</text>
      <text x="28" y="278" fill="#A855F7" font-family="sans-serif" font-size="20" font-weight="bold">24:18</text>
      <circle cx="260" cy="262" r="18" fill="#8B5CF6" />
      <!-- Play icon -->
      <polygon points="256,254 268,262 256,270" fill="#FFFFFF" />
    </g>
  </g>
</svg>
