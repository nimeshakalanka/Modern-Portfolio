<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082F49" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#medBg)" />
  <circle cx="700" cy="100" r="150" fill="#06B6D4" opacity="0.15" filter="blur(40px)" />

  <g transform="translate(60, 50)">
    <rect width="680" height="400" rx="16" fill="#0F172A" stroke="#0284C7" stroke-width="1.5" />
    <rect width="680" height="42" rx="16" fill="#082F49" />
    <circle cx="28" cy="21" r="5" fill="#EF4444" />
    <circle cx="46" cy="21" r="5" fill="#F59E0B" />
    <circle cx="64" cy="21" r="5" fill="#10B981" />
    <rect x="250" y="12" width="180" height="18" rx="9" fill="#0C4A6E" />
    <text x="340" y="25" fill="#7DD3FC" font-family="sans-serif" font-size="10" text-anchor="middle">healthtrack.care/portal</text>

    <!-- Top Status Bar -->
    <g transform="translate(24, 60)">
      <rect width="632" height="60" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="36" cy="30" r="18" fill="#0284C7" />
      <!-- Medical Cross -->
      <rect x="33" y="19" width="6" height="22" rx="2" fill="#FFFFFF" />
      <rect x="25" y="27" width="22" height="6" rx="2" fill="#FFFFFF" />
      <text x="70" y="27" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">HealthTrack Telehealth Suite</text>
      <text x="70" y="45" fill="#38BDF8" font-family="sans-serif" font-size="11">● Active Encrypted Consultation Channel</text>
      
      <!-- Call to Action button -->
      <rect x="490" y="14" width="128" height="32" rx="8" fill="url(#cyanGrad)" />
      <text x="554" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">+ New Booking</text>
    </g>

    <!-- Left: Schedule & Doctor Cards -->
    <g transform="translate(24, 135)">
      <rect width="380" height="240" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="20" y="30" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="bold">Upcoming Telehealth Visits</text>

      <!-- Appt Card 1 -->
      <g transform="translate(18, 48)">
        <rect width="344" height="80" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1" />
        <circle cx="35" cy="40" r="20" fill="#38BDF8" opacity="0.3" />
        <text x="35" y="45" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">MD</text>
        <text x="70" y="32" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold">Dr. Sarah Jenkins</text>
        <text x="70" y="50" fill="#94A3B8" font-family="sans-serif" font-size="11">Cardiology Follow-up • Video Call</text>
        <text x="70" y="68" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="600">Today, 2:30 PM</text>
        <rect x="260" y="26" width="70" height="28" rx="6" fill="#0284C7" />
        <text x="295" y="44" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Join</text>
      </g>

      <!-- Appt Card 2 -->
      <g transform="translate(18, 140)">
        <rect width="344" height="80" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <circle cx="35" cy="40" r="20" fill="#10B981" opacity="0.3" />
        <text x="35" y="45" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">NP</text>
        <text x="70" y="32" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold">Nurse Practitioner Davis</text>
        <text x="70" y="50" fill="#94A3B8" font-family="sans-serif" font-size="11">Routine Lab Review</text>
        <text x="70" y="68" fill="#94A3B8" font-family="sans-serif" font-size="11">Oct 24, 10:00 AM</text>
      </g>
    </g>

    <!-- Right: Vitals Monitor Graphic -->
    <g transform="translate(420, 135)">
      <rect width="236" height="240" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="18" y="30" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="bold">Live Bio-Telemetry</text>

      <rect x="18" y="45" width="200" height="75" rx="8" fill="#0F172A" />
      <text x="28" y="70" fill="#94A3B8" font-family="sans-serif" font-size="10">HEART RATE</text>
      <text x="28" y="98" fill="#EF4444" font-family="sans-serif" font-size="22" font-weight="bold">72 <tspan font-size="11" fill="#94A3B8">bpm</tspan></text>
      <!-- Pulse line -->
      <path d="M 110 85 L 125 85 L 132 65 L 140 100 L 148 75 L 155 85 L 195 85" fill="none" stroke="#EF4444" stroke-width="2" />

      <rect x="18" y="135" width="200" height="85" rx="8" fill="#0F172A" />
      <text x="28" y="160" fill="#94A3B8" font-family="sans-serif" font-size="10">BLOOD OXYGEN (SpO2)</text>
      <text x="28" y="190" fill="#06B6D4" font-family="sans-serif" font-size="22" font-weight="bold">99%</text>
      <!-- Bar meter -->
      <rect x="110" y="176" width="90" height="12" rx="6" fill="#334155" />
      <rect x="110" y="176" width="88" height="12" rx="6" fill="#06B6D4" />
    </g>
  </g>
</svg>
