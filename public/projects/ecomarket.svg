<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ecoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ecoBg)" />

  <!-- Ambient light -->
  <circle cx="680" cy="120" r="160" fill="#10B981" opacity="0.15" filter="blur(30px)" />
  <circle cx="100" cy="380" r="140" fill="#059669" opacity="0.15" filter="blur(30px)" />

  <!-- Browser Window Mockup -->
  <g transform="translate(60, 50)">
    <rect width="680" height="400" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <rect width="680" height="42" rx="16" fill="#111827" />
    <circle cx="28" cy="21" r="5" fill="#EF4444" />
    <circle cx="46" cy="21" r="5" fill="#F59E0B" />
    <circle cx="64" cy="21" r="5" fill="#10B981" />
    <rect x="220" y="12" width="240" height="18" rx="9" fill="#1F2937" />
    <text x="340" y="25" fill="#9CA3AF" font-family="sans-serif" font-size="10" text-anchor="middle">ecomarket.store/catalog</text>

    <!-- Top store banner -->
    <rect x="24" y="60" width="632" height="70" rx="12" fill="url(#leafGrad)" opacity="0.9" />
    <text x="50" y="94" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="bold">Zero-Waste Lifestyle Essentials</text>
    <text x="50" y="114" fill="#D1FAE5" font-family="sans-serif" font-size="12">Carbon-neutral deliveries on 100% of orders</text>

    <!-- Product Card 1 -->
    <g transform="translate(24, 150)">
      <rect width="198" height="230" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <rect x="14" y="14" width="170" height="110" rx="8" fill="#334155" />
      <!-- Reusable Bottle Shape -->
      <path d="M 90 40 L 108 40 L 108 55 L 115 65 L 115 105 L 83 105 L 83 65 L 90 55 Z" fill="#10B981" />
      <text x="14" y="146" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Bamboo Hydro Bottle</text>
      <text x="14" y="165" fill="#94A3B8" font-family="sans-serif" font-size="11">Grade A Organic Insulated</text>
      <text x="14" y="195" fill="#10B981" font-family="sans-serif" font-size="15" font-weight="bold">$28.00</text>
      <rect x="120" y="178" width="64" height="26" rx="6" fill="#10B981" />
      <text x="152" y="195" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Add</text>
    </g>

    <!-- Product Card 2 -->
    <g transform="translate(241, 150)">
      <rect width="198" height="230" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <rect x="14" y="14" width="170" height="110" rx="8" fill="#334155" />
      <!-- Organic Cotton Bag Shape -->
      <path d="M 80 50 C 80 35, 118 35, 118 50 L 126 105 L 72 105 Z" fill="#34D399" />
      <text x="14" y="146" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Woven Cotton Tote</text>
      <text x="14" y="165" fill="#94A3B8" font-family="sans-serif" font-size="11">Fair-trade Certified Fiber</text>
      <text x="14" y="195" fill="#10B981" font-family="sans-serif" font-size="15" font-weight="bold">$16.50</text>
      <rect x="120" y="178" width="64" height="26" rx="6" fill="#10B981" />
      <text x="152" y="195" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Add</text>
    </g>

    <!-- Product Card 3 -->
    <g transform="translate(458, 150)">
      <rect width="198" height="230" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <rect x="14" y="14" width="170" height="110" rx="8" fill="#334155" />
      <!-- Solar Charger Graphic -->
      <rect x="75" y="45" width="48" height="60" rx="4" fill="#059669" />
      <line x1="75" y1="65" x2="123" y2="65" stroke="#10B981" stroke-width="2" />
      <line x1="75" y1="85" x2="123" y2="85" stroke="#10B981" stroke-width="2" />
      <text x="14" y="146" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Solar Pocket Bank</text>
      <text x="14" y="165" fill="#94A3B8" font-family="sans-serif" font-size="11">10,000mAh Clean Energy</text>
      <text x="14" y="195" fill="#10B981" font-family="sans-serif" font-size="15" font-weight="bold">$49.99</text>
      <rect x="120" y="178" width="64" height="26" rx="6" fill="#10B981" />
      <text x="152" y="195" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Add</text>
    </g>
  </g>
</svg>
